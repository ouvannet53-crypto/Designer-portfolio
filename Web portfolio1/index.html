<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; }

    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      background: rgba(10,10,10,0.9); backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 40px; border-bottom: 1px solid #1a1a1a;
    }
    nav .logo { font-size: 1.4rem; font-weight: 700; color: #fff; text-decoration: none; }
    nav ul { list-style: none; display: flex; gap: 32px; }
    nav ul li a { color: #aaa; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
    nav ul li a:hover { color: #fff; }

    .hero {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      padding: 0 20px;
    }
    .hero h1 { font-size: 3.5rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
    .hero p { font-size: 1.1rem; color: #888; max-width: 500px; line-height: 1.6; }
    .hero .scroll-down {
      margin-top: 40px; width: 30px; height: 50px;
      border: 2px solid #444; border-radius: 15px; position: relative;
    }
    .hero .scroll-down::after {
      content: ''; width: 4px; height: 8px; background: #fff;
      border-radius: 2px; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%); animation: scroll 1.5s infinite;
    }
    @keyframes scroll {
      0% { opacity: 1; top: 8px; }
      100% { opacity: 0; top: 28px; }
    }

    section { padding: 80px 40px; max-width: 1200px; margin: 0 auto; }
    section h2 {
      font-size: 2rem; margin-bottom: 40px; position: relative;
      display: inline-block; color: #fff;
    }
    section h2::after {
      content: ''; position: absolute; bottom: -8px; left: 0;
      width: 40px; height: 3px; background: #6c63ff;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .gallery .item {
      position: relative; overflow: hidden; border-radius: 8px;
      cursor: pointer; background: #111;
    }
    .gallery .item img {
      width: 100%; height: 100%; object-fit: cover;
      display: block; transition: transform 0.5s ease;
    }
    .gallery .item:hover img { transform: scale(1.05); }
    .gallery .item .overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5); opacity: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s;
    }
    .gallery .item:hover .overlay { opacity: 1; }
    .overlay span { color: #fff; font-size: 1.5rem; }

    .gallery .item.featured {
      grid-column: span 2; grid-row: span 2;
    }

    footer {
      text-align: center; padding: 40px; color: #555; font-size: 0.85rem;
      border-top: 1px solid #1a1a1a;
    }

    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.95); justify-content: center;
      align-items: center; cursor: pointer;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 90vh; object-fit: contain; border-radius: 4px; }
    .lightbox .close {
      position: absolute; top: 20px; right: 30px;
      color: #fff; font-size: 2rem; cursor: pointer; z-index: 201;
    }
    .lightbox .nav-btn {
      position: absolute; top: 50%; color: #fff; font-size: 2.5rem;
      cursor: pointer; padding: 10px 20px; user-select: none;
      transform: translateY(-50%); z-index: 201;
    }
    .lightbox .nav-btn.prev { left: 20px; }
    .lightbox .nav-btn.next { right: 20px; }

    @media (max-width: 1024px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.2rem; }
      nav { padding: 12px 20px; }
      nav ul { gap: 20px; }
      section { padding: 60px 20px; }
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .gallery .item.featured { grid-column: span 2; grid-row: span 1; }
      .lightbox .nav-btn { font-size: 1.5rem; padding: 5px 10px; }
    }
    @media (max-width: 480px) {
      .gallery { grid-template-columns: 1fr; }
      .gallery .item.featured { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="#" class="logo">Portfolio</a>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#gallery">Work</a></li>
    </ul>
  </nav>

  <div class="hero" id="home">
    <h1>My Portfolio</h1>
    <p>A collection of my work and creative projects.</p>
    <div class="scroll-down"></div>
  </div>

  <section id="gallery">
    <h2>My Work</h2>
    <div class="gallery" id="galleryGrid"></div>
  </section>

  <footer>&copy; 2026 Portfolio. All rights reserved.</footer>

  <div class="lightbox" id="lightbox">
    <span class="close" id="closeBtn">&times;</span>
    <span class="nav-btn prev" id="prevBtn">&#8249;</span>
    <span class="nav-btn next" id="nextBtn">&#8250;</span>
    <img id="lightboxImg" src="" alt="Portfolio image">
  </div>

  <script>
    const imageFiles = [
      "portfolio2.webp",
      "portfolio 3.webp",
      "portfolio 33.webp","portfolio 34.webp",
      "portfolio 35.webp","portfolio 36.webp","portfolio 37.webp",
      "portfolio 38.webp","portfolio 39.webp",
      "portfolio 310.webp","portfolio 311.webp","portfolio 312.webp",
      "portfolio 313.webp","portfolio 314.webp","portfolio 315.webp",
      "portfolio 316.webp","portfolio 317.webp","portfolio 318.webp",
      "portfolio 319.webp"
    ];

    const images = imageFiles.map(f => ({
      src: "img pds/" + encodeURIComponent(f).replace(/%20/g, " "),
      alt: f.replace(/\.[^.]+$/, "")
    }));

    const grid = document.getElementById("galleryGrid");
    images.forEach(function(img, idx) {
      var div = document.createElement("div");
      div.className = "item" + (idx === 0 ? " featured" : "");
      var imgEl = document.createElement("img");
      imgEl.src = img.src;
      imgEl.alt = img.alt;
      imgEl.loading = "lazy";
      imgEl.onerror = function() { div.style.display = "none"; };
      var overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.innerHTML = "<span>+</span>";
      div.appendChild(imgEl);
      div.appendChild(overlay);
      div.addEventListener("click", function() { openLightbox(idx); });
      grid.appendChild(div);
    });

    var currentIndex = 0;
    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightboxImg");

    function openLightbox(idx) {
      currentIndex = idx;
      lightboxImg.src = images[idx].src;
      lightboxImg.alt = images[idx].alt;
      lightbox.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
      document.body.style.overflow = "";
    }

    document.getElementById("closeBtn").addEventListener("click", function(e) {
      e.stopPropagation(); closeLightbox();
    });
    lightbox.addEventListener("click", closeLightbox);
    lightboxImg.addEventListener("click", function(e) { e.stopPropagation(); });

    document.getElementById("prevBtn").addEventListener("click", function(e) {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      lightboxImg.src = images[currentIndex].src;
      lightboxImg.alt = images[currentIndex].alt;
    });
    document.getElementById("nextBtn").addEventListener("click", function(e) {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % images.length;
      lightboxImg.src = images[currentIndex].src;
      lightboxImg.alt = images[currentIndex].alt;
    });

    document.addEventListener("keydown", function(e) {
      if (!lightbox.classList.contains("active")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
      if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
    });
  </script>
</body>
</html>
